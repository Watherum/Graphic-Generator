<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Default Top 8</title>
    <style>
        body {
            margin: 0;
            background: #000;
        }

        #canvas {
            position: relative;
            display: inline-block;
        }

        #canvas img {
            position: absolute;
            top: 0;
            left: 0;
        }

        /* The first image stays in flow to size the canvas (below), and an inline
           image picks up a few pixels of baseline gap underneath it. That made the
           canvas 1084px tall instead of 1080: every top:% resolved against the
           wrong height, and the extra strip showed as a black bar under the
           artwork. display:block removes the gap. */
        #canvas img:first-child {
            display: block;
        }

        /* First child stays in flow to give the container its natural size */
        #canvas img:first-child {
            position: relative;
        }

        #canvas .label {
            position: absolute;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            text-align: center;
            transform: translateX(-50%);
        }

        #canvas .sponsor {
            color: #FFD700;
        }

        #canvas .render {
            position: absolute;
            width: auto;
        }

        /* Hide until all images are loaded */
        #canvas.loading {
            visibility: hidden;
        }
    
        /* Fit-to-window preview scaling.
           The layout is a fixed 1920-wide canvas: positions are %, but font sizes
           and the artwork are absolute px. Shrinking the *window* would therefore
           leave the text at full size over a clipped graphic, so the whole canvas
           is scaled as one unit instead - text keeps its exact proportion to the
           art. Only ever scales DOWN (see the script): at 1:1 or larger the
           graphic is untouched, so a screenshot stays pixel-exact. */
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        #canvas {
            transform-origin: top left;
        }
    </style>
</head>

<body>

    <div id="canvas" class="loading">
        <!-- Background first so it renders behind everything -->
        <img src="../Resources/Top_8_Images/Default/Default Background.png" alt=""/>
        <img src="../Resources/Top_8_Images/Default/Default Player Boxes.png" alt=""/>

        <!-- Character renders (sit between the box layers and the text overlay) -->
        <img id="place-1-render" class="render" style="top: 32%;  left: 3%;    height: 55%;" alt=""/>
        <img id="place-2-render" class="render" style="top: 27%;  left: 33%;   height: 37%;" alt=""/>
        <img id="place-3-render" class="render" style="top: 28%;  left: 56.5%;   height: 36%;" alt=""/>
        <img id="place-4-render" class="render" style="top: 27%;  left: 77%;   height: 37%;" alt=""/>
        <img id="place-5-render" class="render" style="top: 66%;  left: 34%;   height: 26%;" alt=""/>
        <img id="place-6-render" class="render" style="top: 65%;  left: 50%;   height: 26%;" alt=""/>
        <img id="place-7-render" class="render" style="top: 66%;  left: 67%;   height: 27%;" alt=""/>
        <img id="place-8-render" class="render" style="top: 67%;  left: 83%;   height: 26%;" alt=""/>

        <img src="../Resources/Top_8_Images/Default/Default Text Boxes.png" alt=""/>
        <img src="../Resources/Top_8_Images/Default/Default Number Boxes.png" alt=""/>

        <!-- Event info -->
        <span id="event-name"    class="label" style="top: 4%;    left: 50%;   font-size: 50px; color: #000;"></span>
        <span id="event-link"    class="label" style="top: 11%;   left: 50%;   font-size: 40px;"></span>
        <span id="event-entrants"class="label" style="top: 16.5%; left: 50%;   font-size: 40px;"></span>
        <span id="event-date"    class="label" style="top: 22%;   left: 50%;   font-size: 40px;"></span>

        <!-- Placement numbers -->
        <span id="place-1-num" class="label" style="top: 29.5%; left: 6.5%;    font-size: 100px;"></span>
        <span id="place-2-num" class="label" style="top: 30.4%; left: 37%; font-size: 75px;"></span>
        <span id="place-3-num" class="label" style="top: 30.4%; left: 58.9%; font-size: 75px;"></span>
        <span id="place-4-num" class="label" style="top: 30.4%; left: 80.5%; font-size: 75px;"></span>
        <span id="place-5-num" class="label" style="top: 67%;   left: 36.1%; font-size: 50px;"></span>
        <span id="place-6-num" class="label" style="top: 67%;   left: 52.6%; font-size: 50px;"></span>
        <span id="place-7-num" class="label" style="top: 67%;   left: 69.3%; font-size: 50px;"></span>
        <span id="place-8-num" class="label" style="top: 67%;   left: 85.8%; font-size: 50px;"></span>

        <!-- Player names -->
        <span id="place-1-name" class="label" style="top: 88%;   left: 17%;    font-size: 60px;"></span>
        <span id="place-2-name" class="label" style="top: 55.8%; left: 43.5%; font-size: 40px;"></span>
        <span id="place-3-name" class="label" style="top: 55.8%; left: 65.6%; font-size: 40px;"></span>
        <span id="place-4-name" class="label" style="top: 55.8%; left: 87%; font-size: 40px;"></span>
        <span id="place-5-name" class="label" style="top: 89%;   left: 40.8%; font-size: 26px;"></span>
        <span id="place-6-name" class="label" style="top: 89%;   left: 57.5%; font-size: 30px;"></span>
        <span id="place-7-name" class="label" style="top: 89%;   left: 74%; font-size: 30px;"></span>
        <span id="place-8-name" class="label" style="top: 89%;   left: 90.5%; font-size: 30px;"></span>

        <!-- Sponsors -->
        <span id="place-1-sponsor" class="label sponsor" style="top: 84%;   left: 17%;    font-size: 30px;"></span>
        <span id="place-2-sponsor" class="label sponsor" style="top: 53.4%; left: 38%; font-size: 25px;"></span>
        <span id="place-3-sponsor" class="label sponsor" style="top: 53.4%; left: 60%; font-size: 25px;"></span>
        <span id="place-4-sponsor" class="label sponsor" style="top: 53.4%; left: 81.6%; font-size: 25px;"></span>
        <span id="place-5-sponsor" class="label sponsor" style="top: 86.3%; left: 37.1%; font-size: 22px;"></span>
        <span id="place-6-sponsor" class="label sponsor" style="top: 86.3%; left: 57%; font-size: 22px;"></span>
        <span id="place-7-sponsor" class="label sponsor" style="top: 86.3%; left: 71.3%; font-size: 22px;"></span>
        <span id="place-8-sponsor" class="label sponsor" style="top: 86.3%; left: 87%; font-size: 22px;"></span>
    </div>

    <script>
        const DATA_FILE       = '../Top_8_Texts/Default Top 8 HTML.txt';
        const PLAYER_DB_FILE  = '../Resources/Player_database.csv';
        const RENDER_DIR      = '../Resources/Character_Renders/Ultimate_Full_render';

        // Parse Top_8_Images.txt → { info: {}, placements: [] }
        function parseDataFile(text) {
            const info = {};
            const placements = [];
            for (const raw of text.split('\n')) {
                const line = raw.trim();
                if (!line || line.startsWith('#')) continue;
                const colonIdx = line.indexOf(':');
                if (colonIdx !== -1 && !/^\d/.test(line)) {
                    const key = line.slice(0, colonIdx).trim().toLowerCase().replace(/\s+/g, '_');
                    info[key] = line.slice(colonIdx + 1).trim();
                    continue;
                }
                if (/^\d/.test(line)) {
                    const [place, name, sponsor, charToken] = line.split(',').map(s => s.trim());
                    const [character, skin] = splitCharSkin(charToken);
                    placements.push({ place, name, sponsor, character, skin });
                }
            }
            return { info, placements };
        }

        // 'Mario:5' -> ['Mario', '5'] -- the same per-set costume override the
        // thumbnail VOD lines use. Character names never contain a colon, so
        // splitting on the first one is unambiguous.
        function splitCharSkin(token) {
            const text = (token || '').trim();
            const i = text.indexOf(':');
            if (i === -1) return [text, ''];
            return [text.slice(0, i).trim(), text.slice(i + 1).trim()];
        }

        // Parse Player_database.csv -> { "sophilo": { chars: { "mario": "5" }, charList: ["Mario", ...] } }
        function parsePlayerDB(text) {
            const db = {};
            for (const raw of text.split('\n')) {
                const line = raw.trim();
                if (!line || line.startsWith('#')) continue;
                const parts = line.split(',').map(s => s.trim());
                const playerName = parts[0];
                if (!playerName) continue;
                const chars = {};
                const pinned = {};
                const charList = [];
                for (let i = 1; i + 1 < parts.length; i += 2) {
                    const charName = parts[i];
                    let alt        = parts[i + 1];
                    if (!charName) continue;
                    // A character may be listed more than once to give the player
                    // several costumes. A leading '*' marks the preferred one; with
                    // no star the first listed wins. The marker must never reach a
                    // path, where it would silently 404.
                    const isPreferred = alt.startsWith('*');
                    if (isPreferred) alt = alt.slice(1).trim();
                    const charKey = charName.toLowerCase();
                    if (!(charKey in chars) || (isPreferred && !pinned[charKey])) {
                        chars[charKey] = alt || '1';
                        if (isPreferred) pinned[charKey] = true;
                    }
                    if (!charList.includes(charName)) charList.push(charName);
                }
                db[playerName.toLowerCase()] = { chars, charList };
            }
            return db;
        }

        // Returns both the path to use and the one to fall back to, so a costume
        // that names no render on disk degrades to the player's usual render
        // instead of blanking the slot. Precedence matches the thumbnails:
        // line costume -> player's preferred -> alt 1.
        function resolveRenderPath(playerName, characterName, playerDB, skin) {
            const playerEntry = playerDB[playerName.toLowerCase()];
            // Fall back to player's first DB character when none specified in Top 8 file
            if (!characterName && playerEntry?.charList.length)
                characterName = playerEntry.charList[0];
            if (!characterName) return { src: '', fallback: '' };
            const ownAlt   = playerEntry?.chars[characterName.toLowerCase()] ?? '1';
            const fallback = `${RENDER_DIR}/${characterName} (${ownAlt}).png`;
            if (!skin) return { src: fallback, fallback };
            // A costume is just the alt number here, so no label table is needed.
            const alt = skin.replace(/[()\s]/g, '');
            return { src: `${RENDER_DIR}/${characterName} (${alt}).png`, fallback };
        }

        // Fits text within maxWidthPct/maxHeightPct of canvas: splits at last space first, then shrinks font.
        const SLOT_MAX_WIDTHS    = [0.238, 0.221, 0.214, 0.214, 0.167, 0.165, 0.165, 0.165];
        const SLOT_MAX_HEIGHTS   = [0.07,  0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05];
        const SLOT_ALLOW_WRAPPING = [true,  true, true, true, true, true, true, true];
        // Every element fitText() has touched, with the arguments it was given,
        // so the whole pass can be repeated once the real font has landed.
        const fitted = new Map();
        function refitAll() {
            fitted.forEach((args, el) => fitText(el, args[0], args[1], args[2]));
        }

        function fitText(el, maxWidthPct, allowWrap = true, maxHeightPct = 1) {
            if (!el) return;
            const canvas     = document.getElementById('canvas');
            // Never measure against a canvas that has no width yet: the shrink
            // loop below would drive every label to its 8px floor.
            if (!canvas || !canvas.offsetWidth) return;
            fitted.set(el, [maxWidthPct, allowWrap, maxHeightPct]);

            // Fitting is destructive -- it lowers the font size and may inject a
            // line break -- so every pass has to start again from the untouched
            // text at the untouched size. Without this a repeat pass could only
            // ever shrink further, and a size measured against the wrong font
            // metrics (see fontsReady()) could never be recovered.
            if (el.dataset.fitBaseSize === undefined) {
                el.dataset.fitBaseSize = parseFloat(el.style.fontSize) ||
                                         parseFloat(getComputedStyle(el).fontSize) || 0;
            }
            if (el.dataset.fitBaseText === undefined) el.dataset.fitBaseText = el.textContent;
            // The layout config may set white-space inline (the per-slot wrap
            // checkbox), so restore what was there rather than clearing it.
            if (el.dataset.fitBaseWs === undefined) el.dataset.fitBaseWs = el.style.whiteSpace;
            const base = parseFloat(el.dataset.fitBaseSize);
            el.textContent      = el.dataset.fitBaseText;
            el.style.whiteSpace = el.dataset.fitBaseWs;
            if (base) el.style.fontSize = base + 'px';
            if (!el.textContent || !base) return;

            const maxWidth   = canvas.offsetWidth  * maxWidthPct;
            const maxHeight  = canvas.offsetHeight * maxHeightPct;

            let wrapped = false;
            if (allowWrap && el.scrollWidth > maxWidth) {
                const spaceIdx = el.textContent.lastIndexOf(' ');
                if (spaceIdx !== -1) {
                    const full = el.textContent;
                    el.style.whiteSpace = 'pre-line';
                    el.textContent = full.slice(0, spaceIdx) + '\n' + full.slice(spaceIdx + 1);
                    wrapped = true;
                }
            }

            // The height budget guards against a *wrapped* name spilling into the
            // row below -- that is the only case it was ever there for. Applying
            // it to a single line just fights the size set in the layout config:
            // these budgets, like the widths, were implicitly tuned to the
            // fallback font, and HKModular's line box is taller than Arial's, so
            // once measuring was honest every name was pulled a few px under its
            // configured size no matter how short the tag was.
            let size = base;
            while ((el.scrollWidth > maxWidth || (wrapped && el.scrollHeight > maxHeight))
                   && size > 8) {
                size -= 1;
                el.style.fontSize = size + 'px';
            }
        }

        function populate({ info, placements }, playerDB) {
            const set = (id, text) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.textContent = text ?? '';
                // New text: drop the copy fitText() kept for re-fitting.
                delete el.dataset.fitBaseText;
            };

            set('event-name',     info['event_name']);
            set('event-link',     info['event_link']);
            set('event-entrants', info['event_entrants']);
            set('event-date',     info['event_date']);

            placements.forEach(({ place, name, sponsor, character, skin }, i) => {
                const slot = i + 1;
                const maxW  = SLOT_MAX_WIDTHS[i];
                const maxH  = SLOT_MAX_HEIGHTS[i];
                const wrap  = SLOT_ALLOW_WRAPPING[i];
                set(`place-${slot}-num`,     place);
                set(`place-${slot}-name`,    name);
                fitText(document.getElementById(`place-${slot}-name`), maxW, wrap, maxH);
                set(`place-${slot}-sponsor`, sponsor);
                fitText(document.getElementById(`place-${slot}-sponsor`), maxW, wrap, maxH);

                const renderEl = document.getElementById(`place-${slot}-render`);
                if (renderEl && character) {
                    const { src, fallback } = resolveRenderPath(name, character, playerDB, skin);
                    // A mistyped skin would otherwise leave the slot empty with no
                    // hint why. One retry only -- the handler clears itself, so a
                    // fallback that is also missing cannot loop.
                    renderEl.onerror = () => {
                        renderEl.onerror = null;
                        if (fallback && fallback !== src) renderEl.src = fallback;
                    };
                    renderEl.src = src;
                }
            });
        }

        // Image load gate — waits for the 4 static overlay images only
        const canvas = document.getElementById('canvas');
        const overlayImgs = canvas.querySelectorAll('img[src]');
        // Resolves once every image has settled; also the "safe to measure" gate below.
        const imagesReady = new Promise(resolve => {
            let loaded = 0;
            const onImgDone = () => {
                if (++loaded === overlayImgs.length) {
                    canvas.classList.remove('loading');
                    resolve();
                }
            };
            if (!overlayImgs.length) { canvas.classList.remove('loading'); return resolve(); }
            overlayImgs.forEach(img => {
                if (img.complete) onImgDone();
                else { img.addEventListener('load', onImgDone); img.addEventListener('error', onImgDone); }
            });
        });

        // fitText() shrinks a name until it fits canvas.offsetWidth * slot%. The
        // canvas takes its width from the background image, so before that image
        // loads the width is 0, every name overflows a zero budget, and the loop
        // runs all the way down to its 8px floor -- a cold load rendered unreadable
        // text while a reload (images cached) looked fine. The webfont matters for
        // the same reason: fallback metrics measure the wrong width. Wait for both.
        //
        // document.fonts.ready is not enough on its own: it waits only for faces
        // the page has already *asked* for, and at this point every label is
        // still empty, so nothing on the page uses the webfont yet and it
        // resolves immediately against the fallback. populate() then measured
        // with fallback metrics -- wider than the real face -- and shrank names
        // several px too far; the mis-fit only became visible once the real face
        // swapped in, and only when it was not already warm in the cache, which
        // is exactly why the preview disagreed with OBS intermittently. Ask for
        // each face the labels actually use, then wait.
        function fontsReady() {
            if (!document.fonts) return Promise.resolve();
            const specs = new Set();
            document.querySelectorAll('#canvas .label').forEach(el => {
                const cs = getComputedStyle(el);
                specs.add(`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`);
            });
            return Promise.all([...specs].map(s => document.fonts.load(s).catch(() => {})))
                .then(() => document.fonts.ready)
                .catch(() => {});
        }

        const layoutReady = Promise.all([imagesReady, fontsReady()]);

        // Fetch both files in parallel, then populate
        // Note: requires a local HTTP server (e.g. `python -m http.server`) — fetch() is blocked on file://
        Promise.all([
            fetch(DATA_FILE).then(r => r.text()),
            fetch(PLAYER_DB_FILE).then(r => r.text()),
            layoutReady,
        ])
        .then(([dataText, dbText]) => {
            const data     = parseDataFile(dataText);
            const playerDB = parsePlayerDB(dbText);
            populate(data, playerDB);
            // Belt and braces: should a face still settle after the gate
            // above (a slow disk, a face the gate could not name), fit once
            // more from the stored originals instead of leaving the
            // mis-measured sizes.
            if (document.fonts) {
                document.fonts.ready.then(() => requestAnimationFrame(refitAll));
            }
        })
        .catch(err => console.error('Could not load data files:', err));
    </script>


    <!-- fit-to-window: scale the canvas down so the whole graphic fits the window -->
    <script>
        (function () {
            const canvas = document.getElementById('canvas');
            if (!canvas) return;

            function fit() {
                // offsetWidth/Height are layout values, so they are unaffected by
                // the transform we set here -- no feedback loop with the observer.
                const w = canvas.offsetWidth, h = canvas.offsetHeight;
                const vw = window.innerWidth, vh = window.innerHeight;
                // Bail on a viewport we cannot measure yet: scaling by 0 would
                // blank the page rather than merely misfit it.
                if (!w || !h || !vw || !vh) return;
                // Never scale above 1: upscaling a 1920px graphic only blurs it.
                // Anchored at the origin rather than centred, so the graphic always
                // starts at (0, 0) -- that is what lets an exported capture be
                // cropped from the corner without knowing the browser's viewport.
                const scale = Math.min(1, vw / w, vh / h);
                canvas.style.transform = 'scale(' + scale + ')';
            }

            window.addEventListener('resize', fit);
            window.addEventListener('load', fit);
            document.addEventListener('DOMContentLoaded', fit);
            // The canvas takes its size from the background image, so re-fit when
            // that lands -- and again when the webfont changes the text metrics.
            if (window.ResizeObserver) {
                new ResizeObserver(fit).observe(canvas);
                // The viewport itself: covers a view that is created hidden and
                // shown later (the GUI's embedded preview), where nothing else
                // fires and the page would sit unscaled at 1:1.
                new ResizeObserver(fit).observe(document.documentElement);
            }
            if (document.fonts) document.fonts.ready.then(fit);
            fit();
        })();
    </script>

</body>
</html>
