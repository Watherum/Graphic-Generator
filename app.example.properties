# Copy this file to app.properties (same folder) and fill in what you need.
# app.properties is gitignored, so your credentials are never committed.
# Leave anything blank for a site you do not fetch from.

# start.gg -- not required; the queries the fetchers use are public.
startgg.api.key =

# parry.gg -- required for the parry.gg provider on the Fetch Data tab.
parrygg.api.key =

# Challonge -- required for the Challonge provider on the Fetch Data tab.
#
# Create an application at https://challonge.com/settings/developer and copy
# its client id and secret here. The generator exchanges them for an access
# token itself (OAuth client credentials); there is no browser step, and the
# token is cached in .challonge_token.json beside this file.
challonge.client.id =
challonge.client.secret =

# Optional, and only for accounts issued a v1 API key before Challonge's
# developer portal moved to OAuth applications. Set this and it is used
# instead of the client id/secret above; leave it blank otherwise.
challonge.api.key =
